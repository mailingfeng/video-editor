<script>
'use strict';
const $ = id => document.getElementById(id);
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const supported = /\.(mp4|mov|mkv|avi|webm|m4v)$/i;
const labels = {pending:'等待处理',running:'处理中',success:'已完成',failed:'失败',canceled:'已取消'};
let nextID=1, batchSequence=0, timer=null, modalAction=null, modalReturnFocus=null;
const state={ rows:[], concurrency:3, directory:null, view:'queue', filter:'all', running:false, batches:[], selectedBatch:null, errorsOnly:false };
function sizeText(size){return size>=1024**3?(size/1024**3).toFixed(2)+' GB':size>=1024**2?(size/1024**2).toFixed(1).replace(/\.0$/,'')+' MB':size>=1024?(size/1024).toFixed(1)+' KB':size+' B';}
function timeText(value){return new Date(value).toLocaleTimeString('zh-CN',{hour12:false});}
function dateTime(value){return value?new Date(value).toLocaleString('zh-CN',{hour12:false}):'尚未结束';}
function notice(message,error=false){$('notice-text').textContent=message; $('notice').classList.toggle('error',error); $('notice').hidden=false;}
function openModal(title,body,{confirmText='知道了',action=null,danger=false,cancel=false}={}){
 modalReturnFocus=document.activeElement; modalAction=action; $('modal-title').textContent=title; $('modal-body').innerHTML=body; $('modal-confirm').textContent=confirmText; $('modal-confirm').className='btn '+(danger?'btn-danger':'btn-primary'); $('modal-cancel').hidden=!cancel; $('modal').showModal(); (cancel?$('modal-cancel'):$('modal-confirm')).focus();
}
function closeModal(){ $('modal').close(); modalAction=null; if(modalReturnFocus?.isConnected) modalReturnFocus.focus({preventScroll:true}); }
$('modal-close').onclick=closeModal; $('modal-cancel').onclick=closeModal; $('modal-confirm').onclick=()=>{const action=modalAction;closeModal(); if(action)action();};
$('modal').addEventListener('cancel',event=>{event.preventDefault();closeModal();});
$('modal').addEventListener('click',event=>{if(event.target===$('modal')){const rect=$('modal').getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeModal();}});
$('notice-close').onclick=()=>{$('notice').hidden=true;};
$('help').onclick=()=>openModal('使用说明', '<div class="od-stack"><p>1. 添加视频或整个文件夹，检查待处理列表。</p><p>2. 选择输出位置与并行任务数，然后启动处理。</p><p>3. 在“日志与报告”中查看逐项结果并导出记录。</p><p class="muted">目录写入需要浏览器支持及授权；不可用时可下载日志与报告。批次记录保存在当前页面会话，关闭页面前请导出。</p></div>');
function statusMarkup(row){const glyph={pending:'clock',running:'settings',success:'check',failed:'error',canceled:'stop'}[row.status];return `<span class="status-text status-${row.status}">${icon(glyph)}${row.status==='running'?row.progress+'%':labels[row.status]}</span>${row.status==='running'?`<span class="progress-track" role="progressbar" aria-label="${escapeHTML(row.name)}处理进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${row.progress}"><span class="progress-fill" style="transform:scaleX(${row.progress/100})"></span></span>`:''}`;}
function renderRows(){
 const focusKey=document.activeElement?.dataset?.focusKey;
 const rows=state.rows.filter(r=>state.filter==='all'||r.status===state.filter);
 $('file-list').innerHTML=rows.length?rows.map(r=>`<div class="file-row" role="listitem"><div class="file-info od-row"><div class="file-symbol">${icon('film')}</div><div class="od-field od-fill"><button class="file-name od-truncate" data-detail="${r.id}" data-focus-key="name-${r.id}" aria-label="查看 ${escapeHTML(r.name)} 详情">${escapeHTML(r.name)}</button><span class="file-meta">${escapeHTML(r.name.split('.').pop().toUpperCase())}${r.status==='running'?' · '+(r.progress<20?'准备任务':r.progress<80?'处理任务':'生成记录'):r.status==='failed'?' · 查看失败原因':''}</span></div></div><span class="file-size">${sizeText(r.size)}</span><div class="file-status od-cell">${statusMarkup(r)}</div><div class="row-actions"><button class="icon-btn" data-detail="${r.id}" data-focus-key="detail-${r.id}" aria-label="查看 ${escapeHTML(r.name)} 详情">${icon('eye')}</button><button class="icon-btn delete-btn" data-remove="${r.id}" data-focus-key="remove-${r.id}" aria-label="移除 ${escapeHTML(r.name)}" ${state.running?'disabled':''}>${icon('trash')}</button></div></div>`).join(''):`<div class="empty">${icon(state.rows.length?'film':'upload')}<h3>${state.rows.length?'没有符合筛选的任务':'添加你的第一个视频'}</h3><p>${state.rows.length?'切换筛选条件查看其他任务。':'选择文件、文件夹，或将视频拖入这里。'}</p>${state.rows.length?'':'<button class="btn" data-import="files">添加文件</button>'}</div>`;
 if(focusKey){const candidate=document.querySelector(`[data-focus-key="${focusKey}"]`);if(candidate)candidate.focus({preventScroll:true});else document.querySelector(`[data-filter="${state.filter}"]`)?.focus({preventScroll:true});}
 $('queue-count').textContent=state.rows.length;$('queue-source').textContent=state.rows.length?'本地文件 · '+state.rows.length+' 个视频':'尚未添加视频';
 for(const filter of ['all','running','success','failed']){$('filter-'+filter).textContent=filter==='all'?state.rows.length:state.rows.filter(r=>r.status===filter).length;const button=document.querySelector(`[data-filter="${filter}"]`);button.classList.toggle('active',state.filter===filter);button.setAttribute('aria-pressed',String(state.filter===filter));}
 $('retry-all').hidden=state.running||!state.rows.some(r=>r.status==='failed');
}
function batchRows(batch){return batch.end?batch.items:batch.rowIds.map(id=>state.rows.find(r=>r.id===id)).filter(Boolean).map(snapshot);}
function snapshot(row){return {id:row.id,name:row.name,path:row.path,size:row.size,status:row.status,progress:row.progress,error:row.error,attempts:row.attempts,events:[...row.events]};}
function currentBatch(){return state.batches[0]||null;}
function renderControls(){
 for(const id of ['add-files','add-folder','choose-output','use-download','feature','concurrency-select'])$(id).disabled=state.running;
 $('clear-queue').disabled=state.running||!state.rows.length;
 $('concurrency-select').value=String(state.concurrency);$('start').hidden=state.running;$('cancel-batch').hidden=!state.running;$('start').disabled=!state.rows.length;
 const pending=state.rows.filter(r=>r.status==='pending').length;
 $('start').querySelector('span').textContent=state.rows.length&&!pending?'重新处理':'启动处理';
 $('start-helper').textContent=state.running?'当前批次配置已锁定':!state.rows.length?'请先添加至少一个视频':'原始文件保持不变';
 $('ready-text').textContent=state.running?'正在处理':state.rows.length?'准备就绪':'等待添加';$('ready-state').classList.toggle('running',state.running);
 $('footer-status').textContent='并发 '+state.concurrency+' 个任务';
 $('output-name').textContent=state.directory?state.directory.name:'浏览器下载目录';$('use-download').hidden=!state.directory;
 const batch=currentBatch();$('view-current-report').hidden=!batch;
 const rows=batch?batchRows(batch):[];const done=rows.filter(r=>['success','failed','canceled'].includes(r.status)).length;const percentage=rows.length?Math.round(done/rows.length*100):0;
 $('batch-fill').style.transform=`scaleX(${percentage/100})`;$('batch-progress').setAttribute('aria-valuenow',percentage);$('batch-percent').textContent=percentage+'%';
 $('batch-text').textContent=batch?`${batch.id} · ${batch.end?(batch.canceled?'批次已取消':'批次已结束'):done+' / '+rows.length+' 个已结束'}`:'当前队列等待启动';
 $('nav-report-count').textContent=state.batches.length;$('nav-report-count').hidden=state.batches.length===0;
}
function renderAll(){renderRows();renderControls();if(state.view==='reports')renderReport();}
function setView(view){state.view=view;document.querySelectorAll('.nav-button').forEach(b=>{const active=b.dataset.view===view;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;});$('queue-view').hidden=view!=='queue';$('reports-view').hidden=view!=='reports';$('page-title').textContent=view==='queue'?'视频处理':'日志与报告';$('page-subtitle').textContent=view==='queue'?'导入视频并设置处理参数。':'查看批次结果，导出日志与报告。';if(view==='reports')renderReport();}
function importFiles(files){
 if(state.running){notice('请先结束当前批次，再添加文件。',true);return;}
 const supportedFiles=Array.from(files).filter(file=>supported.test(file.name));
 const rejected=files.length-supportedFiles.length;
 if(!supportedFiles.length){notice('未找到支持的视频。请选择 MP4、MOV、MKV、AVI、WEBM 或 M4V 文件。',true);return;}
 let added=0,duplicates=0;const keys=new Set(state.rows.map(r=>[r.path,r.size,r.lastModified].join('|')));
 for(const file of supportedFiles){const path=file.webkitRelativePath||file.name;const key=[path,file.size,file.lastModified].join('|');if(keys.has(key)){duplicates++;continue;}keys.add(key);state.rows.push({id:nextID++,name:file.name,path,size:file.size,lastModified:file.lastModified,attempts:0,status:'pending',progress:0,error:'',events:[]});added++;}
 state.filter='all';setView('queue');renderAll();notice(`已添加 ${added} 个视频${duplicates?'，跳过 '+duplicates+' 个重复项':''}${rejected?'，忽略 '+rejected+' 个不支持的文件':''}。`);
}
$('add-files').onclick=()=>{$('files-input').click();};$('add-folder').onclick=()=>{$('folder-input').click();};
$('files-input').onchange=event=>{importFiles(event.target.files);event.target.value='';};$('folder-input').onchange=event=>{importFiles(event.target.files);event.target.value='';};
let dragDepth=0;
$('drop-zone').addEventListener('dragenter',e=>{e.preventDefault();if(!state.running){dragDepth++;$('drop-zone').classList.add('dragover');}});
$('drop-zone').addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect=state.running?'none':'copy';});
$('drop-zone').addEventListener('dragleave',e=>{e.preventDefault();dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('drop-zone').classList.remove('dragover');});
$('drop-zone').addEventListener('drop',e=>{e.preventDefault();dragDepth=0;$('drop-zone').classList.remove('dragover');importFiles(e.dataTransfer.files);});
window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());
$('clear-queue').onclick=()=>{if(state.running)return;openModal('清空待处理列表？','<p>这会移除列表中的所有任务，已生成的批次报告会保留。原始文件不会被删除。</p>',{confirmText:'清空列表',danger:true,cancel:true,action:()=>{state.rows=[];state.filter='all';renderAll();notice('待处理列表已清空。');}});};
function showDetail(id){const row=state.rows.find(r=>r.id===id);if(!row)return;openModal('任务详情',`<div class="od-field"><span>文件名称</span><strong>${escapeHTML(row.name)}</strong></div><div class="od-field"><span>相对路径／文件名</span><span>${escapeHTML(row.path)}</span></div><div class="od-field"><span>文件信息</span><span>${sizeText(row.size)} · 本地文件</span></div><div class="od-field"><span>处理状态</span><span class="status-${row.status}">${labels[row.status]}${row.status==='running'?' · '+row.progress+'%':''}</span></div>${row.error?'<p class="red">'+escapeHTML(row.error)+'</p>':''}${row.events.length?'<div class="detail-log">'+row.events.map(e=>escapeHTML(timeText(e.time)+' '+e.message)).join('<br>')+'</div>':''}`,{confirmText:row.status==='failed'&&!state.running?'重试此任务':'关闭',action:row.status==='failed'&&!state.running?()=>startBatch([row.id]):null});}
async function chooseOutput(){
 if(state.running)return;
 if(!('showDirectoryPicker' in window)){openModal('使用浏览器下载','<p>当前浏览器不支持直接选择并写入输出目录。</p><p>你可以在“日志与报告”中下载日志和 JSON 报告，再通过浏览器的保存选项选择位置。</p>',{confirmText:'使用下载模式',action:()=>{state.directory=null;renderControls();notice('已使用浏览器下载模式。');}});return;}
 try{const directory=await window.showDirectoryPicker({mode:'readwrite',id:'frameshift-output'});if(state.running){notice('当前批次已启动，请结束后再设置输出目录。',true);return;}state.directory=directory;renderControls();notice('已选择输出目录：'+directory.name+'。');}catch(error){if(error.name!=='AbortError')notice('无法获得目录写入权限，请重新授权或使用浏览器下载。',true);}
}
$('concurrency-select').onchange=event=>{if(state.running)return;state.concurrency=Number(event.target.value);renderControls();};
$('config-info').onclick=()=>openModal('处理配置说明',`<div class="od-field"><span>输出位置</span><strong>${escapeHTML(state.directory?state.directory.name:'浏览器下载目录')}</strong></div><p>${state.directory?'处理结束后，日志与报告自动保存到所选目录。':'处理结束后，可在“日志与报告”中下载记录。'}</p><div class="od-field"><span>处理功能</span><strong>视频指纹扰动</strong><span>低失真重新编码，保持观感基本一致。</span></div><div class="od-field"><span>并行任务</span><span>最多同时处理 ${state.concurrency} 个视频；当前批次启动后配置会锁定。</span></div><div class="od-field"><span>文件命名</span><span class="mono">YYYYMMDD-01.log</span><span class="mono">YYYYMMDD-01.report.json</span></div>`);
$('choose-output').onclick=chooseOutput;$('use-download').onclick=()=>{if(state.running)return;state.directory=null;renderControls();notice('已切换为浏览器下载。');};
function batchID(){const d=new Date();const date=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('');return date+'-'+String(++batchSequence).padStart(2,'0');}
function appendLog(batch,message,level='INFO',row=null){const event={time:new Date().toISOString(),level,message};batch.log.push(event);if(row)row.events.push(event);}
function startBatch(ids=null){
 if(state.running)return;
 const candidates=ids?state.rows.filter(r=>ids.includes(r.id)):state.rows.some(r=>r.status==='pending')?state.rows.filter(r=>r.status==='pending'):state.rows;
 if(!candidates.length){notice('请先添加至少一个视频。',true);return;}
 const batch={id:batchID(),start:new Date().toISOString(),end:null,rowIds:candidates.map(r=>r.id),items:[],concurrency:state.concurrency,output:state.directory?state.directory.name:'浏览器下载',directory:state.directory,log:[],canceled:false,saveState:'not-saved',saveError:''};
 state.batches.unshift(batch);state.selectedBatch=batch.id;state.running=true;state.errorsOnly=false;
 for(const row of candidates){row.status='pending';row.progress=0;row.error='';row.events=[];row.attempts++;}
 appendLog(batch,'批次开始。');appendLog(batch,`功能：视频指纹扰动；方式：低失真重新编码；并发 ${batch.concurrency}；视频 ${candidates.length} 个。`);appendLog(batch,'日志与报告输出：'+batch.output+'。');
 fillSlots(batch);renderAll();$('notice').hidden=true;timer=setInterval(()=>tick(batch),400);
}
function fillSlots(batch){const rows=batch.rowIds.map(id=>state.rows.find(r=>r.id===id));let active=rows.filter(r=>r.status==='running').length;for(const row of rows){if(active>=batch.concurrency)break;if(row.status==='pending'){row.status='running';active++;appendLog(batch,'开始任务：'+row.name,'INFO',row);}}}
function tick(batch){
 if(!state.running||batch.end)return;
 const rows=batch.rowIds.map(id=>state.rows.find(r=>r.id===id));
 for(const row of rows.filter(r=>r.status==='running')){row.progress=Math.min(100,row.progress+5+(row.id%4));if(row.progress===100){row.status='success';appendLog(batch,'流程结束：'+row.name+'。','INFO',row);}}
 fillSlots(batch);
 if(rows.every(r=>['success','failed','canceled'].includes(r.status)))finishBatch(batch);else renderAll();
}
function finishBatch(batch){
 clearInterval(timer);timer=null;state.running=false;batch.end=new Date().toISOString();batch.items=batch.rowIds.map(id=>snapshot(state.rows.find(r=>r.id===id)));
 const success=batch.items.filter(r=>r.status==='success').length,failed=batch.items.filter(r=>r.status==='failed').length,canceled=batch.items.filter(r=>r.status==='canceled').length;
 appendLog(batch,`批次结束：完成 ${success}，失败 ${failed}，取消 ${canceled}。`);renderAll();notice(batch.canceled?'批次已取消，已结束任务的记录已保留。':`批次结束：${success} 个完成${failed?'，'+failed+' 个失败，可查看原因并重试':''}。`,failed>0);
 if(batch.directory)savePair(batch);else{batch.saveState='download';if(state.view==='reports')renderReport();}
}
$('start').onclick=()=>startBatch();$('retry-all').onclick=()=>startBatch(state.rows.filter(r=>r.status==='failed').map(r=>r.id));
$('cancel-batch').onclick=()=>openModal('取消当前批次？','<p>将停止正在处理的任务并取消排队任务。已完成和已失败的结果会保留，原始视频文件不受影响。</p>',{confirmText:'取消批次',danger:true,cancel:true,action:()=>{if(!state.running)return;const batch=currentBatch();batch.canceled=true;for(const id of batch.rowIds){const row=state.rows.find(r=>r.id===id);if(['pending','running'].includes(row.status)){row.status='canceled';appendLog(batch,'用户取消：'+row.name,'INFO',row);}}finishBatch(batch);}});
$('view-current-report').onclick=()=>{state.selectedBatch=currentBatch()?.id;setView('reports');};
function selectedBatch(){return state.batches.find(b=>b.id===state.selectedBatch)||state.batches[0];}
function reportData(batch){const rows=batchRows(batch);return {batchId:batch.id,simulation:true,notice:'执行来源：HTML 交互原型。未接入视频处理引擎，未生成视频输出，未验证感知指纹变化。',feature:'视频指纹扰动',mode:'低失真重新编码，观感基本一致',startedAt:batch.start,finishedAt:batch.end,status:batch.end?(batch.canceled?'canceled':'finished'):'running',concurrency:batch.concurrency,outputLocation:batch.output,summary:{total:rows.length,success:rows.filter(r=>r.status==='success').length,failed:rows.filter(r=>r.status==='failed').length,canceled:rows.filter(r=>r.status==='canceled').length},files:rows.map(r=>({name:r.name,relativePath:r.path,sizeBytes:r.size,status:r.status,progress:r.progress,error:r.error||null,attempts:r.attempts,outputVideo:null}))};}
function logText(batch){return '# 帧序处理日志\n# 执行来源：HTML 交互原型，未接入视频处理引擎。未生成视频输出，未评估实际感知指纹变化。\n# 批次：'+batch.id+'\n'+batch.log.map(e=>`[${e.time}] [${e.level}] ${e.message}`).join('\n')+'\n';}
function renderReport(){
 const batch=selectedBatch();$('report-empty').hidden=!!batch;$('report-content').hidden=!batch;if(!batch){return;}
 state.selectedBatch=batch.id;
 const select=$('batch-select');const expected=state.batches.map(b=>b.id).join('|');if(select.dataset.options!==expected){select.innerHTML=state.batches.map(b=>`<option value="${b.id}">${b.id}</option>`).join('');select.dataset.options=expected;}select.value=batch.id;
 const rows=batchRows(batch);$('report-state').textContent=batch.end?(batch.canceled?'已取消':'已结束'):'记录中';
 const fields=[['处理功能','视频指纹扰动 · 低失真重编码'],['输出位置',batch.output],['开始时间',dateTime(batch.start)],['结束时间',dateTime(batch.end)]];
 $('report-summary').innerHTML=fields.map(([label,value])=>`<div class="od-field"><span class="label">${label}</span><span class="value">${escapeHTML(value)}</span></div>`).join('');
 $('report-table-wrap').innerHTML=`<table class="report-table"><thead><tr><th scope="col">视频文件</th><th scope="col">状态</th><th scope="col">处理结果</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${escapeHTML(r.name)}</td><td class="status-${r.status}">${labels[r.status]}${r.status==='running'?' '+r.progress+'%':''}</td><td>${escapeHTML(r.error||({pending:'等待处理',running:'处理中',success:'流程已结束',canceled:'用户取消'}[r.status]||'查看处理日志'))}</td></tr>`).join('')}</tbody></table>`;
 $('log-filename').textContent=batch.id+'.log';
 const logBody=$('log-body');const wasBottom=logBody.scrollHeight-logBody.scrollTop-logBody.clientHeight<48;const entries=batch.log.filter(e=>!state.errorsOnly||e.level==='ERROR');
 logBody.innerHTML=entries.length?entries.map(e=>`<div class="log-line ${e.level==='ERROR'?'error':''}"><span class="log-time">${escapeHTML(timeText(e.time))}</span><span class="level">${e.level}</span><span class="message">${escapeHTML(e.message)}</span></div>`).join(''):'当前批次没有错误记录。';if(wasBottom)logBody.scrollTop=logBody.scrollHeight;
 $('log-filter').setAttribute('aria-pressed',String(state.errorsOnly));$('log-filter').textContent=state.errorsOnly?'显示全部':'仅看错误';
 const messages={'not-saved':batch.end?'尚未导出。可导出日志或报告。':'处理记录持续更新，导出得到当前快照。',saving:'正在保存日志与报告到输出目录…',saved:'日志与报告已保存至：'+batch.output,failed:'目录保存失败：'+batch.saveError+' 可使用下载按钮保存。',download:'处理流程已结束。请导出日志与报告。'};
 $('save-state').textContent=messages[batch.saveState];$('save-state').classList.toggle('red',batch.saveState==='failed');
}
$('batch-select').onchange=e=>{state.selectedBatch=e.target.value;state.errorsOnly=false;renderReport();};$('log-filter').onclick=()=>{state.errorsOnly=!state.errorsOnly;renderReport();};
async function writeFile(directory,name,content){const handle=await directory.getFileHandle(name,{create:true});const writable=await handle.createWritable();try{await writable.write(content);await writable.close();}catch(error){try{await writable.abort();}catch{}throw error;}}
async function savePair(batch){batch.saveState='saving';if(state.view==='reports')renderReport();try{await writeFile(batch.directory,batch.id+'.log',logText(batch));await writeFile(batch.directory,batch.id+'.report.json',JSON.stringify(reportData(batch),null,2));batch.saveState='saved';notice('日志与报告已保存至：'+batch.output+'。');}catch(error){batch.saveState='failed';batch.saveError=error.name==='NotAllowedError'?'目录写入未授权':'未能写入文件，请检查目录权限';notice('日志或报告保存失败，请在报告页面下载。',true);}if(state.view==='reports')renderReport();}
function download(name,content,mime){const url=URL.createObjectURL(new Blob([content],{type:mime}));const link=document.createElement('a');link.href=url;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
async function exportFile(kind,forceDownload=false){const batch=selectedBatch();if(!batch){notice('请先启动一个批次。',true);return;}const name=batch.id+(kind==='log'?'.log':'.report.json');const content=kind==='log'?logText(batch):JSON.stringify(reportData(batch),null,2);const mime=kind==='log'?'text/plain;charset=utf-8':'application/json;charset=utf-8';if(batch.directory&&!forceDownload){try{if(batch.directory.requestPermission){const permission=await batch.directory.requestPermission({mode:'readwrite'});if(permission!=='granted')throw new Error('permission');}await writeFile(batch.directory,name,content);notice('已保存 '+name+' 至：'+batch.output+'。');return;}catch{download(name,content,mime);notice('目录写入不可用，已向浏览器发起 '+name+' 的下载请求。',true);return;}}download(name,content,mime);notice('已向浏览器发起 '+name+' 的下载请求。');}
$('export-log').onclick=()=>exportFile('log');$('export-report').onclick=()=>exportFile('report');$('download-log').onclick=()=>exportFile('log',true);
document.querySelector('[role="tablist"]').addEventListener('keydown',e=>{
 const current=e.target.closest('[role="tab"]');
 if(!current||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;
 e.preventDefault();const tabs=Array.from(document.querySelectorAll('.nav-button'));const index=tabs.indexOf(current);
 const next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(index+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
 setView(tabs[next].dataset.view);tabs[next].focus();
});
document.addEventListener('click',e=>{
 const view=e.target.closest('[data-view]');if(view){setView(view.dataset.view);return;}
 const filter=e.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;renderRows();return;}
 const detail=e.target.closest('[data-detail]');if(detail){showDetail(Number(detail.dataset.detail));return;}
 const remove=e.target.closest('[data-remove]');if(remove&&!state.running){const id=Number(remove.dataset.remove);state.rows=state.rows.filter(r=>r.id!==id);renderAll();notice('已移除任务，原始文件未删除。');return;}
 const add=e.target.closest('[data-import]');if(add&&!state.running)$('files-input').click();
});
window.addEventListener('beforeunload',e=>{if(state.running){e.preventDefault();e.returnValue='';}});
renderAll();
</script>
</body>
</html>
