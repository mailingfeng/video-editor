name: Upload verified beta installer

on:
  push:
    branches: [ops/publish-beta-1]

permissions:
  actions: read
  contents: write

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Upload verified existing artifact to beta draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, hashlib, urllib.request, urllib.error, zipfile, io
          REPO = 'mailingfeng/video-editor'
          assert os.environ['GITHUB_REPOSITORY'] == REPO
          TOKEN = os.environ['GH_TOKEN']
          RELEASE = 402274554
          SOURCE = '051e9944639c76c77bafa7f5815ca2a2149da341'
          NAME = 'frameshift_0.0.1-beta.1_windows_x64_setup.exe'
          SHA = 'b09739108a431482f460ae40f39043eb56952ce1dde8b67e99d7efed6bca42c0'
          SIZE = 59182967
          ARTIFACT = 11261805331
          ZIP_SHA = '3765a4b6e3cfa9d1b143e9020c5419aa0e136e7ed79f9b8caa3102c3e21d1078'
          headers = {'Authorization': 'Bearer '+TOKEN,
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          def api(path, method='GET'):
              request = urllib.request.Request('https://api.github.com/repos/'+REPO+path, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=120) as response:
                  data = response.read()
              return json.loads(data) if data else None
          release = api('/releases/'+str(RELEASE))
          assert release['tag_name'] == 'v0.0.1-beta.1'
          assert release['target_commitish'] == SOURCE and release['prerelease']
          ref = api('/git/ref/tags/v0.0.1-beta.1')
          assert ref['object']['sha'] == SOURCE and ref['object']['type'] == 'commit'
          existing = next((a for a in release['assets'] if a['name'] == NAME), None)
          if existing and existing['state'] == 'uploaded':
              assert existing['size'] == SIZE and existing['digest'] == 'sha256:'+SHA
              print('Installer already uploaded and verified')
              raise SystemExit(0)
          assert release['draft'], 'Only add assets to the authorized draft'
          if existing:
              assert existing['state'] == 'starter' and existing['digest'] is None
              api('/releases/assets/'+str(existing['id']), method='DELETE')
          artifact = api('/actions/artifacts/'+str(ARTIFACT))
          assert artifact['workflow_run']['head_sha'] == SOURCE
          assert artifact['name'] == 'frameshift-0.0.1-beta.1-windows-x64-development-37087790487'
          assert artifact['digest'] == 'sha256:'+ZIP_SHA and not artifact['expired']
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, response_headers, newurl):
                  return None
          request = urllib.request.Request('https://api.github.com/repos/'+REPO+'/actions/artifacts/'+str(ARTIFACT)+'/zip', headers=headers)
          try:
              urllib.request.build_opener(NoRedirect).open(request, timeout=120)
              raise AssertionError('Expected artifact redirect')
          except urllib.error.HTTPError as error:
              assert error.code == 302
              location = error.headers['Location']
          assert location.startswith('https://')
          # Do not forward the GitHub token to the signed storage redirect.
          with urllib.request.urlopen(location, timeout=120) as response:
              archive_bytes = response.read()
          assert len(archive_bytes) == artifact['size_in_bytes']
          assert hashlib.sha256(archive_bytes).hexdigest() == ZIP_SHA
          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              assert archive.testzip() is None
              build = json.loads(archive.read('.ci-evidence/build.json').decode('utf-8-sig'))
              assert build['sourceCommit'] == SOURCE and build['installerSha256'] == SHA
              data = archive.read('.ci-artifacts/帧序_0.0.1-beta.1_x64-setup.exe')
          assert len(data) == SIZE and hashlib.sha256(data).hexdigest() == SHA
          url = 'https://uploads.github.com/repos/'+REPO+'/releases/'+str(RELEASE)+'/assets?name='+NAME
          request = urllib.request.Request(url, data=data,
              headers={**headers, 'Content-Type':'application/octet-stream'}, method='POST')
          with urllib.request.urlopen(request, timeout=300) as response:
              uploaded = json.load(response)
          assert uploaded['name'] == NAME and uploaded['state'] == 'uploaded'
          assert uploaded['size'] == SIZE and uploaded['digest'] == 'sha256:'+SHA
          print(json.dumps({'asset':NAME, 'sha256':SHA, 'assetId':uploaded['id'], 'verified':True}))
          PY
