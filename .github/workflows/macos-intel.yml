name: macOS Intel development installer

on:
  push:
    branches: [feat/batch-processing, ci/macos-intel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-intel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Rust 1.90.0 Intel
        uses: dtolnay/rust-toolchain@9423510f11512992cb6c790b35e139796f7ac612
        with:
          targets: x86_64-apple-darwin
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Dependencies and locked sidecars
        run: |
          mkdir -p .ci-evidence .ci-artifacts
          npm ci
          node scripts/prepare-sidecars.mjs --target x86_64-apple-darwin | tee .ci-evidence/sidecars.json

      - name: Sidecar and release verifier tests
        run: node --test scripts/prepare-sidecars.test.mjs scripts/verify-release.test.mjs | tee .ci-evidence/node-tests.txt

      - name: Frontend tests
        run: npm run test -- --run | tee .ci-evidence/frontend-tests.txt

      - name: Backend tests
        timeout-minutes: 10
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml | tee .ci-evidence/backend-tests.txt

      - name: Generated media regression
        run: npm run test:media | tee .ci-evidence/generated-media.txt

      - name: Build Intel app and DMG with Tauri Action
        id: build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-apple-darwin --bundles app,dmg --ci -- --locked

      - name: Desktop clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --target x86_64-apple-darwin --release --all-targets --features desktop -- -D warnings

      - name: Mount installer and verify installed resources
        run: |
          installers=(src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg)
          [[ ${#installers[@]} -eq 1 && -f "${installers[0]}" ]]
          mount="$RUNNER_TEMP/frameshift-dmg"
          installed="$RUNNER_TEMP/帧序 installed.app"
          mkdir -p "$mount"
          hdiutil attach "${installers[0]}" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          ditto "$mount/帧序.app" "$installed"
          node scripts/verify-release.mjs --target x86_64-apple-darwin --artifact "$installed" --development --record .ci-evidence/installed-resources.json
          for tool in video-editor ffmpeg ffprobe; do
            otool -L "$installed/Contents/MacOS/$tool" > ".ci-evidence/$tool-libraries.txt"
            if tail -n +2 ".ci-evidence/$tool-libraries.txt" | awk '{print $1}' | grep -Ev '^(/System/Library/|/usr/lib/)' ; then
              echo "Unexpected external library dependency in $tool" >&2
              exit 1
            fi
          done
          printf 'VIDEO_EDITOR_INSTALLED_EXE=%s\n' "$installed/Contents/MacOS/video-editor" >> "$GITHUB_ENV"
          cp "${installers[0]}" .ci-artifacts/
          cp docs/macos-intel-desktop-acceptance.md .ci-artifacts/
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync,readdirSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import os from 'node:os';
          const installer=readdirSync('.ci-artifacts').find(name=>name.endsWith('.dmg'));
          const bytes=readFileSync(`.ci-artifacts/${installer}`);
          writeFileSync('.ci-evidence/build.json',JSON.stringify({target:'x86_64-apple-darwin',sourceCommit:process.env.GITHUB_SHA,runUrl:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,builtAt:new Date().toISOString(),runner:process.env.ImageOS,os:os.release(),installer,installerSizeBytes:bytes.length,installerSha256:createHash('sha256').update(bytes).digest('hex'),releaseStatus:'NOT VERIFIED',scope:'Intel CI build, DMG installation and native bundled-tool checks; unsigned internal beta, desktop acceptance pending'},null,2)+'\n');
          JS

      - name: Media regression using installed tools
        run: |
          if [[ -f docs/requirements/20261002-research/原视频.mp4 ]]; then
            npm run test:media -- --sample-dir docs/requirements/20261002-research | tee .ci-evidence/installed-media.txt
          else
            npm run test:media | tee .ci-evidence/installed-media.txt
          fi

      - name: Upload checked development installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frameshift-${{ steps.build.outputs.appVersion }}-macos-intel-development-${{ github.run_id }}
          path: |
            .ci-artifacts/*.dmg
            .ci-artifacts/macos-intel-desktop-acceptance.md
            .ci-evidence/build.json
            .ci-evidence/installed-resources.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-intel-verification-${{ github.run_id }}
          path: .ci-evidence/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
