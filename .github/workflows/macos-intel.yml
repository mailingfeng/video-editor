name: Publish checked beta.4 native installers
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-beta4
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout publisher based on checked main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check pinned native build receipts and publish beta.4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish-checked-beta4.py
      - name: Save publication receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: beta4-publication-${{ github.run_id }}
          path: |
            .release-work/publication.json
            .release-work/assets/verification-summary.json
            .release-work/assets/SHA256SUMS
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
