name: Windows shortcut diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Inspect baseline and native shortcut behavior
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force .ci-evidence | Out-Null
          $setup = Join-Path $env:RUNNER_TEMP 'baseline.exe'
          $installed = Join-Path $env:RUNNER_TEMP '帧序 installed'
          Invoke-WebRequest 'https://github.com/mailingfeng/video-editor/releases/download/v0.0.1-beta.4/frameshift_0.0.1-beta.4_windows_x64_setup.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne '861b770592c54c8e0f8be02dfa26a660035a105d77ac09ee8f6a39c27ce5b810') { throw 'Baseline checksum mismatch' }
          $p = Start-Process -FilePath $setup -ArgumentList "/S /D=$installed" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Install failed' }
          $shell = New-Object -ComObject WScript.Shell
          $exe = Join-Path $installed 'video-editor.exe'
          $link = Join-Path ([Environment]::GetFolderPath('Programs')) '帧序.lnk'
          Add-Type @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          [ComImport, Guid("00021401-0000-0000-C000-000000000046")] class ShellLink {}
          [ComImport, InterfaceType(ComInterfaceType.InterfaceIsIUnknown), Guid("000214F9-0000-0000-C000-000000000046")]
          interface IShellLinkW {
            void GetPath([Out, MarshalAs(UnmanagedType.LPWStr)] StringBuilder path, int count, IntPtr data, uint flags);
            void GetIDList(out IntPtr list); void SetIDList(IntPtr list);
            void GetDescription([Out, MarshalAs(UnmanagedType.LPWStr)] StringBuilder text, int count);
            void SetDescription([MarshalAs(UnmanagedType.LPWStr)] string text);
            void GetWorkingDirectory([Out, MarshalAs(UnmanagedType.LPWStr)] StringBuilder text, int count);
            void SetWorkingDirectory([MarshalAs(UnmanagedType.LPWStr)] string text);
            void GetArguments([Out, MarshalAs(UnmanagedType.LPWStr)] StringBuilder text, int count);
            void SetArguments([MarshalAs(UnmanagedType.LPWStr)] string text);
            void GetHotkey(out short key); void SetHotkey(short key);
            void GetShowCmd(out int value); void SetShowCmd(int value);
            void GetIconLocation([Out, MarshalAs(UnmanagedType.LPWStr)] StringBuilder text, int count, out int index);
            void SetIconLocation([MarshalAs(UnmanagedType.LPWStr)] string text, int index);
            void SetRelativePath([MarshalAs(UnmanagedType.LPWStr)] string path, uint flags);
            void Resolve(IntPtr window, uint flags); void SetPath([MarshalAs(UnmanagedType.LPWStr)] string path);
          }
          public static class NativeShortcut {
            public static string Target(string path) {
              var link = (IShellLinkW)new ShellLink();
              try { ((System.Runtime.InteropServices.ComTypes.IPersistFile)link).Load(path, 0);
                var result = new StringBuilder(32768); link.GetPath(result, result.Capacity, IntPtr.Zero, 4); return result.ToString();
              } finally { Marshal.FinalReleaseComObject(link); }
            }
          }
          '@
          $result = [ordered]@{
            sourceCommit = $env:GITHUB_SHA
            expected = $exe
            expectedExists = (Test-Path -LiteralPath $exe)
            baselineTarget = $shell.CreateShortcut($link).TargetPath
            baselineNativeTarget = [NativeShortcut]::Target($link)
            baselineBytes = [Convert]::ToBase64String([IO.File]::ReadAllBytes($link))
            baselineLength = (Get-Item $link).Length
          }
          foreach ($name in @('probe.lnk', '探测 fixture.lnk')) {
            try {
              $fixture = Join-Path $env:RUNNER_TEMP $name
              $created = $shell.CreateShortcut($fixture)
              $created.TargetPath = $exe
              $created.Save()
              $result[$name] = $shell.CreateShortcut($fixture).TargetPath
            } catch { $result[$name] = $_.Exception.Message }
          }
          $result | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 .ci-evidence/shortcut-probe.json
          $result | Select-Object expected,expectedExists,baselineTarget,baselineNativeTarget,baselineLength,'probe.lnk','探测 fixture.lnk' | ConvertTo-Json
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-shortcut-probe-${{ github.run_id }}
          path: .ci-evidence/
          include-hidden-files: true
          retention-days: 3
